# Lokální běh mimo WorkMux (ve WorkMux session se nepouští, appka jde rovnou proti sourozenci db).
# Schéma zakládá `prisma migrate deploy` v predev, proto se armygame.sql do initdb nemountuje (P3005).
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: armygame
      MYSQL_DATABASE: armygame
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-parmygame"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    environment:
      DATABASE_URL: mysql://root:armygame@db:3306/armygame
      JWT_SECRET: dev-armygame-jwt-secret-change-me
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # Odpovídá až po npm install, migracích a seedu — na to čeká worker.
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:3000/"]
      interval: 10s
      timeout: 10s
      retries: 60

  # Náhrada bin/daemon.php: splatné akce, hladomor a úlohy z tabulky tasks (scripts/worker.ts).
  worker:
    image: node:20
    working_dir: /app
    command: npm run worker
    environment:
      DATABASE_URL: mysql://root:armygame@db:3306/armygame
    volumes:
      - .:/app
    depends_on:
      app:
        condition: service_healthy

volumes:
  db_data:
